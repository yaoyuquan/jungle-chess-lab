server:
  port: 8080

spring:
  application:
    name: jungle-chess-lab

logging:
  level:
    com.yaoyuquan.jungle: INFO

jungle:
  ai:
    # 具名连接池。棋手通过 provider 字段引用其中一条，不同棋手可以分属不同服务商
    providers:
      claude:
        type: anthropic
        # 留空走官方地址，填上可走中转
        base-url: ${ANTHROPIC_BASE_URL:}
        api-key: ${ANTHROPIC_API_KEY:}
      gpt:
        type: openai
        base-url: ${OPENAI_BASE_URL:}
        api-key: ${OPENAI_API_KEY:}
        # OpenAI 官方支持完整的 JSON Schema 约束
        json-mode: json_schema
      jev:
        # TypeSafe 的 System One 判断型模型，不生成文本，直接在候选着法里挑一个
        type: jev
        base-url: ${TYPESAFE_BASE_URL:https://api.typesafe.ai/v1}
        api-key: ${TYPESAFE_API_KEY:}
    # 棋手没写 provider 时用这条
    default-provider: ${JUNGLE_AI_DEFAULT_PROVIDER:claude}
    timeout: 60s
    max-retries: 2
    # 把发给模型的请求体与模型返回的原始响应打进日志，排查问题用；不需要时设为 false
    log-payloads: ${JUNGLE_AI_LOG_PAYLOADS:true}
    # 一场对局最多两个 AI：人机对战挑其中一个当对手，观战模式就是这两个互下。
    # 两个席位完全对等，唯一的区别是各自指向哪条连接、哪个模型。
    players:
      - id: qingyun
        name: 青云
        code: QINGYUN
        provider: claude
        model: deepseek-v4-pro
        effort: medium
        temperature: 0.6
      - id: xuanji
        name: 玄机
        code: XUANJI
        provider: claude
        model: deepseek-v4-pro
        effort: medium
        temperature: 0.6
